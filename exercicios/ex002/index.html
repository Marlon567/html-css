<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paragrafos</title>
</head>
<body>
    <h1>Paragrafos e quebras de linhas</h1>
    <p>Você pode escrever escrever tudo de qualquer jeito.
    apenas estando entre as tags &lt;p&gt; e &lt;/p&gt;
    </p>
    <p>Se precisar quebrar o texto em qualquer lugar é só utilizar a tag &lt;br&gt;.</p>
    <p>Vamos adicionar alguns simbolos especiais:
        <br>
        &reg;
        &copy;
        &trade;
        &euro;
        &pound;
        &yen;
        &cent;
        &Delta;
        &downarrow;
    </p>
    <hr>
    <p>Vamos adicionar alguns emojis:
        &#x1F60F;
        &#x1F619;
    </p>
</body>
</html>
