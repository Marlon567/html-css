<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="LEÃO logo.png" type="image/x-icon">
    <title>Midias em HTML 5</title>
</head>
<body>
    <h1>Imagem Dinâmica</h1>
    <p>Tente abrir esse site em varios dispositios diferentes ou simplismente aumento ou diminua o tamanho do seu navegador</p>

    <picture>
        <source media="(max-width: 750px)" srcset="imagens/foto-p.png" type="image/png">

        <source media="(max-width: 1000px)" srcset="imagens/foto-m.png" type="image/png">

        <img src="imagens/foto-g.png" alt="Imagem flexivel">
    </picture>

    <h1>Reproduzindo audios</h1>
    <p>vamos aprender a reproduzir áudios em HTML 5</p>
    <audio>
        <source src="midia/Merry Go - Silent Film Light - Kevin MacLeod.mp3" type="audio/mpeg">
        <source srcset="midia/Merry Go - Silent Film Light - Kevin MacLeod.ogg" type="audio/ogg">
        <source srcset="midia/Merry Go - Silent Film Light - Kevin MacLeod.wav" type="audio/wav">
    </audio>
    <p>Infeslizmente seu navegador não consegue reproduzir áudios <a href="midia/Merry Go - Silent Film Light - Kevin MacLeod.mp3">Cliqui aqui para baixar o arquivo MP3</a>
</body>
</html>
